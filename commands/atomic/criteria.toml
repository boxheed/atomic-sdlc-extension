description = "Generates Gherkin criteria. Infers and reads the Spec file using tools."

prompt = """
# Task: Acceptance Criteria & Validation
You are an SDET. Your goal is to generate Gherkin scenarios for a User Story.

# Process
1. **Identify the Specification:** Look at the command arguments and find the input reference'.
2. **Read the Context:** Use the `read_file` tool to ingest the content of that Specification.
3. **Logic Audit:** Compare the User Story to the Specification.
   - If there is a data gap or contradiction, STOP. Use `write_file` to output an ERROR JSON.
   - If sound, generate 3-5 Gherkin scenarios.
4. **Final Output:** Use `write_file` to save the result to the '.json' path found in the arguments.

# Error JSON Structure
{
  "status": "ERROR",
  "error_type": "AMBIGUITY | CONTRADICTION",
  "message": "Detailed explanation",
  "clarification_needed": "A direct question for the stakeholder"
}

# Success JSON Structure
{
  "status": "SUCCESS",
  "story_id": "...",
  "scenarios": [{"name": "...", "gherkin": "..."}]
}

# Input Command
{{args}}
"""