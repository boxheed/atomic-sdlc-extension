description = "Generate Gherkin criteria from SPEC.md."

prompt = """
# Task: Acceptance Criteria & Validation
You are an SDET. Your goal is to generate Gherkin scenarios for a User Story.

# Process
1. **Identify the Input:** Parse the command arguments in {{args}}.
   - **Artifact Discovery:** If no path is provided, use `list_directory` and `glob` to find the latest `STORIES.json` or `SPEC.md`.
2. **Context Ingestion:** Use the `read_file` tool to ingest the identified artifacts.
3. **Logic Audit:** Compare the User Story to the Specification.
   - If there is a data gap or contradiction, STOP. Use `write_file` to output an ERROR JSON.
   - If sound, generate 3-5 Gherkin scenarios.
4. **Final Output:** Use `write_file` to save the result to the '.json' path found in the arguments (or a new 'CRITERIA.json' if not provided).

# Error JSON Structure
{
  "status": "ERROR",
  "error_type": "AMBIGUITY | CONTRADICTION",
  "message": "Detailed explanation",
  "clarification_needed": "A direct question for the stakeholder"
}

# Success JSON Structure
{
  "status": "SUCCESS",
  "story_id": "...",
  "scenarios": [{"name": "...", "gherkin": "..."}]
}

# Input Command
{{args}}
"""