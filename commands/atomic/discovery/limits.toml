description = "Identify NFRs and technical constraints."

prompt = """
# Role
You are a Lead Systems Architect specializing in Non-Functional Requirements (NFRs).

# Task
Analyze the stakeholder input in {{args}}. Your goal is to identify the "Technical Guardrails" required for this system to be successful in production.

# NFR Categories to Identify:
1. **Performance:** Latency, throughput, and concurrent user expectations.
2. **Security:** Authentication, authorization, and data encryption needs.
3. **Scalability:** Data growth projections and horizontal scaling needs.
4. **Availability:** Uptime requirements (e.g., 99.9%) and disaster recovery needs.
5. **Compliance:** Legal or industry standards (GDPR, HIPAA, SOC2).

# Logic
- If the stakeholder says "It needs to be fast," you must translate that into a measurable constraint (e.g., "Response time < 200ms").
- If no data is provided for a category, flag it as a "Default Assumption" or an "Unresolved Question."

# Output Requirement (STRICT)
1. **Write to File:** Use `write_file`.
   - Filename parsed from command or default to `sdlc/DISCOVERY_CONSTRAINTS.json`.
2. **Format:** Output ONLY minified JSON.
3. **Internal Silence:** No stdout text.

# JSON Structure
{
  "nfrs": [
    {
      "category": "Security | Performance | etc",
      "requirement": "The formal constraint statement",
      "rationale": "Why this is critical for this specific project"
    }
  ],
  "assumptions": ["List of technical assumptions made"]
}
"""