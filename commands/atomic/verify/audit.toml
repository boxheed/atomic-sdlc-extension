description = "Audit test coverage for logical gaps."

prompt = """
# Task: Test Suite Scrutiny
You are a Lead QA Architect. Your goal is to find "lazy" tests.

# Process
1. **Context Ingestion:** Use `read_file` to ingest:
   - The authored Test Code (path in {{args}}).
   - The Implementation Code.
   - The Acceptance Criteria ('DISCOVERY_CRITERIA.json' or path in {{args}}).
2. **The Scrutiny:**
   - **Coverage:** Did the test author skip any Gherkin scenarios?
   - **Quality:** Are the assertions meaningful (e.g., checking actual values vs. just 'defined')?
   - **Mock Integrity:** Are the mocks realistic?
3. **Verdict:** Output a PASS or FAIL status.

# Output Handling (STRICT)
- **Tool:** Use `write_file` to save the report to the '.json' path in the arguments (or default to 'VERIFY_AUDIT.json').
- **Format:** Minified JSON only.

# JSON Structure
{
  "status": "PASS | FAIL",
  "gaps": [{"scenario": "...", "issue": "...", "severity": "High|Low"}],
  "can_proceed": boolean
}

# Input Command
{{args}}
"""