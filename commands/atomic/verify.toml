description = "Verifies that documentation accurately reflects the code and the Specification."

prompt = """
# Task: Documentation Verification
You are a Senior Technical Editor and Documentation Auditor.

# Process
1. **Context Ingestion:** Use `read_file` to ingest:
   - The authored Code ('.ts', '.js', '.py', etc. path in {{args}}).
   - The generated Documentation ('.md' path).
   - The Formal Specification (for high-level context).
2. **The Verification Audit:**
   - **Accuracy:** Does the documentation describe logic that does not exist in the code?
   - **Completeness:** Are the input parameters, return types, and edge cases mentioned in the code correctly documented?
   - **Alignment:** Does the documentation contradict the business rules in the Specification?
3. **Verdict:** Output a PASS or FAIL status.

# Output Handling (STRICT)
- **Tool:** Use `write_file` to save the verification report to the '.json' path in the arguments.
- **Format:** Minified JSON only. No conversational text.

# JSON Structure
{
  "status": "PASS | FAIL",
  "discrepancies": [
    {
      "severity": "Critical | Minor",
      "location": "Header/Section Name",
      "issue": "Description of the inaccuracy",
      "correction": "How the documentation should be updated"
    }
  ],
  "is_accurate": boolean
}

# Input Command
{{args}}
"""